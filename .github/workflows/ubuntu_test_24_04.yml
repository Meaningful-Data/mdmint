name: Ubuntu 24.04 Tests

on:
  pull_request:
    branches: ["master"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-markdown-it \
            python3-mdit-py-plugins \
            python3-docx \
            python3-yaml \
            python3-bs4 \
            python3-matplotlib \
            python3-arabic-reshaper \
            python3-bidi \
            python3-html5lib \
            python3-pil \
            python3-pypdf \
            python3-reportlab \
            python3-svglib \
            python3-asn1crypto \
            python3-click \
            python3-cryptography \
            python3-oscrypto \
            python3-qrcode \
            python3-requests \
            python3-tzlocal \
            python3-uritools \
            python3-pytest

      - name: Install pip-only dependencies
        # Not packaged for Ubuntu 24.04, or packaged too old (xhtml2pdf 0.2.5). These
        # versions are the newest whose own requirements the packages above satisfy.
        run: |
          pip install --no-dependencies --break-system-packages \
            htmldocx==0.0.6 \
            xhtml2pdf==0.2.16 \
            pyhanko==0.21.0 \
            pyhanko-certvalidator==0.26.8

      - name: Run tests
        run: pytest --verbose --tb=short --strict-markers --strict-config --durations=10
